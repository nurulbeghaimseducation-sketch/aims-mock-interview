<!DOCTYPE html>
<html lang="en" data-theme="navy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIMS Mock Interview (Lite)</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#eef4f9;--card:#fff;--tx:#0d1b2a;--mu:#5b7186;--bd:#cfe0e5;--ac:#0e2b4a;--ac2:#fff;--gold:#c9962b}
:root[data-theme="slate"]{--bg:#0f1419;--card:#1a2028;--tx:#e6edf3;--mu:#8b98a5;--bd:#2c3640;--ac:#4a9eff;--ac2:#fff;--gold:#ffb84d}
:root[data-theme="emerald"]{--bg:#eaf5ee;--card:#fff;--tx:#0d2818;--mu:#4d6a56;--bd:#c1dcc8;--ac:#0d5c3b;--ac2:#fff;--gold:#c9a227}
:root[data-theme="crimson"]{--bg:#fef0f3;--card:#fff;--tx:#3d0a14;--mu:#8a4b5a;--bd:#f5c8d3;--ac:#9b1c3b;--ac2:#fff;--gold:#c9962b}
:root[data-theme="clean"]{--bg:#f6f8fa;--card:#fff;--tx:#1f2328;--mu:#656d76;--bd:#d0d7de;--ac:#0e6f80;--ac2:#fff;--gold:#c9962b}
:root[data-theme="purple"]{--bg:#f5f0ff;--card:#fff;--tx:#2b0a4a;--mu:#6b4d8a;--bd:#ddd0f0;--ac:#5b1a99;--ac2:#fff;--gold:#c9962b}
:root[data-theme="indigo"]{--bg:#eef1ff;--card:#fff;--tx:#0a1240;--mu:#4a5580;--bd:#c8d0ee;--ac:#3a44a1;--ac2:#fff;--gold:#ffb84d}
:root[data-theme="amber"]{--bg:#fef8ec;--card:#fffdf7;--tx:#3d2400;--mu:#7a5820;--bd:#f0dfb8;--ac:#a8651f;--ac2:#fff;--gold:#e0b000}
:root[data-theme="ocean"]{--bg:#e6f2ff;--card:#fff;--tx:#0c2540;--mu:#4a6a86;--bd:#c3d8ee;--ac:#0b6ebf;--ac2:#fff;--gold:#00a3a3}
:root[data-theme="contrast"]{--bg:#000;--card:#0d0d0d;--tx:#fff;--mu:#c0c0c0;--bd:#3a3a3a;--ac:#ffde00;--ac2:#000;--gold:#ffde00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
header{background:var(--ac);color:var(--ac2);padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:3px solid var(--gold)}
header h1{font-size:18px;margin:0;flex:1}header button{background:rgba(255,255,255,.1);color:inherit;border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:8px;cursor:pointer}
header button.p{background:var(--gold);color:#000;font-weight:bold;border:none}
.wrap{max-width:800px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:20px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,.05)}
input,select{width:100%;padding:10px;margin:5px 0 15px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button{background:var(--ac);color:var(--ac2);border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold}
button:hover{opacity:0.9}
#sess{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding:20px;z-index:100;text-align:center}
#sess.on{display:flex}
#cam{position:fixed;right:20px;bottom:20px;width:200px;border-radius:10px;border:3px solid var(--gold);background:#000;transform:scaleX(-1);z-index:10}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:20px}
#qt{font-size:32px;font-weight:bold}
#tm{font-size:80px;font-weight:bold;color:var(--gold)}
</style>
</head>
<body>
<header>
  <h1>AIMS Mock Interview</h1>
  <select id="themeSel" style="width:150px;margin:0" onchange="document.documentElement.setAttribute('data-theme',this.value)">
    <option value="navy">Navy Professional</option><option value="slate">Slate Dark</option><option value="emerald">Emerald</option><option value="crimson">Crimson</option><option value="clean">Clean Light</option><option value="purple">Royal Purple</option><option value="indigo">Indigo</option><option value="amber">Warm Amber</option><option value="ocean">Ocean Blue</option><option value="contrast">High Contrast</option>
  </select>
  <button id="tS" class="p" onclick="show('setup')">Setup</button>
  <button id="tR" onclick="show('sessions')">Sessions</button>
</header>

<div class="wrap" id="setup">
  <div class="card">
    <h3>Create Student Link</h3>
    <label>Student Name</label><input type="text" id="fN" placeholder="e.g. John Doe">
    <label>CRM Number</label><input type="text" id="fC" placeholder="e.g. 12345">
    <button onclick="createLink()">Generate Link</button>
    <div id="lk" style="display:none;margin-top:15px">
      <input type="text" id="lko" readonly onclick="this.select()">
    </div>
  </div>
</div>

<div class="wrap" id="sessions" style="display:none">
  <div class="card">
    <h3>Student Sessions</h3>
    <button onclick="loadSessions()">Refresh List</button>
    <div id="lst" style="margin-top:15px"></div>
  </div>
</div>

<div id="sess">
  <video id="cam" autoplay playsinline muted></video>
  <div class="mid">
    <div id="ph">Question 1 of 1</div>
    <div id="qt">Tell me about yourself.</div>
    <div id="tm">60</div>
    <button id="end" onclick="stop()">Finish & Save</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
<script>
var CONFIG={SUPABASE_URL:"https://litkmsiksywkbetftdds.supabase.co",SUPABASE_KEY:"sb_publishable_XySBGo7K45IgY6lpGLhAAg_KUh_1Y_R"};
var sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);
var ME=null,stream=null,mr=null,chunks=[],timer=null,timeLeft=60;
var STUCODE=new URLSearchParams(window.location.hash.substring(1)).get("c");

function show(t){
  document.getElementById('setup').style.display=t=='setup'?'':'none';
  document.getElementById('sessions').style.display=t=='sessions'?'':'none';
  document.getElementById('tS').className=t=='setup'?'p':'';
  document.getElementById('tR').className=t=='sessions'?'p':'';
  if(t=='sessions')loadSessions();
}

async function init(){
  var r=await sb.auth.getSession();
  if(r.data.session){ME=r.data.session.user}else{await sb.auth.signInWithPassword({email:"nurul@aimseducation.com",password:"password123"})}
}

async function createLink(){
  var n=document.getElementById('fN').value;
  var c=document.getElementById('fC').value;
  if(!n){alert('Enter name');return}
  var code=Math.random().toString(36).substring(2,10);
  await sb.from('students').insert({code:code,display_name:n,crm:c,officer_id:(await sb.auth.getSession()).data.session.user.id,status:'registered'});
  var url=window.location.origin+window.location.pathname+"#c="+code;
  document.getElementById('lko').value=url;
  document.getElementById('lk').style.display='block';
  alert('Link created!');
}

async function loadSessions(){
  var r=await sb.from('sessions').select('*').order('created_at',{ascending:false});
  var h='';
  (r.data||[]).forEach(s=>{
    h+='<div class="card" style="padding:10px;margin:10px 0"><b>'+s.student+'</b> ('+s.crm+')<br>'+new Date(s.created_at).toLocaleString()+'</div>';
  });
  document.getElementById('lst').innerHTML=h||'No sessions yet.';
}

async function startStudent(){
  var r=await sb.from('students').select('*').eq('code',STUCODE).single();
  if(!r.data){alert('Invalid link');return}
  document.getElementById('setup').style.display='none';
  document.getElementById('sessions').style.display='none';
  document.getElementById('sess').classList.add('on');
  
  stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  document.getElementById('cam').srcObject=stream;
  
  mr=new MediaRecorder(stream);
  mr.ondataavailable=e=>chunks.push(e.data);
  mr.start();

  timer=setInterval(()=>{
    timeLeft--;
    document.getElementById('tm').innerText=timeLeft;
    if(timeLeft<=0)stop();
  },1000);
}

async function stop(){
  clearInterval(timer);
  mr.stop();
  mr.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop());
    var blob=new Blob(chunks,{type:'video/webm'});
    var id=crypto.randomUUID();
    var path=id+'/video.webm';
    document.getElementById('sess').classList.remove('on');
    alert('Uploading... Please wait.');
    
    await sb.storage.from('recordings').upload(path,blob);
    await sb.from('sessions').insert({id:id,student:'Student',crm:'',video_path:path,owner_id:(await sb.auth.getSession()).data.session.user.id});
    alert('Session saved successfully!');
    window.location.reload();
  }
}

if(STUCODE){
  document.body.innerHTML='<div class="wrap"><div class="card"><h2>Welcome to your interview</h2><p>Please ensure your camera is working.</p><button onclick="startStudent()">Start Interview</button></div></div>';
}else{
  init();
}
</script>
</body>
</html>
